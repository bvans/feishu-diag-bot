# 复制为 docker-compose.yml 后改成你自己的值。
services:
  # CLIProxyAPI：把 Chat Completions 兼容端点转成 Codex 要的 Responses 协议。
  # 不用它时（直连 OpenAI / ChatGPT 登录）删掉这个服务，并把 config.yaml 里
  # codex.model_providers 改回直连或删掉。
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"  # 本机调试用；bot 走 compose 内网，不依赖这个映射
    volumes:
      - ./cliproxyapi-config.yaml:/CLIProxyAPI/config.yaml:ro
      # OAuth 登录（Codex/Claude/Gemini 订阅）才需要持久化 auth 目录：
      # - ./cliproxyapi-auths:/root/.cli-proxy-api

  feishu-diag-bot:
    depends_on:
      - cliproxyapi
    build: .
    image: feishu-diag-bot:latest
    restart: unless-stopped
    env_file:
      - .env   # FEISHU_APP_ID、FEISHU_APP_SECRET、GEMINI_API_KEY、OPENAI_API_KEY、CLIPROXYAPI_API_KEY
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/log/myapp:/var/log/myapp:ro   # 机器人要读的日志（按 config.yaml 里的 logs 改）
      # 私有仓库的 SSH key（config.yaml 里 git_ssh_key_file 指向容器内路径）：
      # - ./id_diag:/run/secrets/git_ssh_key:ro
